name: In-app purchases setup

# App Store Connect setup (idempotent), by tag:
#   iap-*     the pearl packs and starter pack (tools/asc/iap.py)
#   meta-*    the listing: names, subtitle, privacy/support/marketing URLs, category, age rating, description,
#             keywords, review notes, price Free, availability (tools/asc/listing.py --pricing)
#   shots-*   the 2868x1320 screenshots from the newest preview run's store/ folder on ci-reports
#   attach-*  the newest processed build of the version onto the App Store version
on:
  push:
    tags: ["iap-*", "meta-*", "shots-*", "attach-*"]
    branches: ["run/iap-*", "run/meta-*", "run/shots-*", "run/attach-*"]   # tag pushes are blocked from some sessions; a run/<name> branch works the same
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create in-app purchases
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
          REVIEW_FIRST_NAME: ${{ secrets.REVIEW_FIRST_NAME }}
          REVIEW_LAST_NAME: ${{ secrets.REVIEW_LAST_NAME }}
          REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
          REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
          APP_VERSION: "1.0.0"
        run: |
          pip install -q pyjwt cryptography requests pillow
          printf '%s\n' "$APPSTORE_P8" > "$RUNNER_TEMP/key.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/key.p8" ASC_KEY_ID="$APPSTORE_KEY_ID" ASC_ISSUER_ID="$APPSTORE_ISSUER_ID"
          set -o pipefail
          case "${GITHUB_REF_NAME#run/}" in
            meta-*)   python3 tools/asc/listing.py --pricing 2>&1 | tee gc.txt ;;
            attach-*) python3 tools/asc/listing.py --attach-build 2>&1 | tee gc.txt ;;
            shots-*)
              git fetch -q origin ci-reports
              run=$(git ls-tree --name-only origin/ci-reports previews/ | sed 's/.*run-//' | sort -n | while read n; do git ls-tree --name-only origin/ci-reports "previews/run-$n/store/" | grep -q . && echo $n; done | tail -1)
              echo "screenshots from preview run $run" | tee gc.txt
              mkdir -p "$RUNNER_TEMP/shots"
              for f in $(git ls-tree --name-only origin/ci-reports "previews/run-$run/store/"); do git show "origin/ci-reports:$f" > "$RUNNER_TEMP/shots/$(basename $f)"; done
              # store order: the first three are what people see in search
              cd "$RUNNER_TEMP/shots" && i=1 && for n in 12_drift 01_title 09e_shop 30_night_drift 04_map 02_garage 07_story 18_roundabout 13_drift_smoke; do [ -f $n.jpg ] && mv $n.jpg $(printf %02d $i)_$n.jpg && i=$((i+1)); done; ls; cd - >/dev/null
              SHOTS_DIR="$RUNNER_TEMP/shots" python3 tools/asc/listing.py --screenshots 2>&1 | tee -a gc.txt ;;
            *)        python3 tools/asc/iap.py 2>&1 | tee gc.txt ;;
          esac
      - name: Publish report
        if: always()
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git fetch -q origin ci-reports && git checkout -q ci-reports || git checkout -q --orphan ci-reports
          { echo "iap run ${{ github.run_number }} ref ${{ github.ref_name }}"; cat gc.txt 2>/dev/null; } > latest-iap.txt
          git add latest-iap.txt && git commit -qm "iap ${{ github.run_number }}" && git push -q origin ci-reports
